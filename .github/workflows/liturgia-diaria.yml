
name: Atualizar liturgia diaria

on:
  workflow_dispatch:
  schedule:
    - cron: "20 11 * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-liturgia
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Atualizar liturgia
        run: node tools/gerar-liturgia.mjs

      - name: Salvar atualizacao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Atualiza liturgia diaria"
          git push
