
name: Atualizar liturgia diaria

on:
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * *"

permissions:
  contents: write

concurrency:
  group: atualizar-liturgia
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Conferir script
        run: |
          test -f tools/gerar-liturgia.mjs

      - name: Gerar liturgia
        run: node tools/gerar-liturgia.mjs

      - name: Salvar alteracoes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dados/liturgia
            git commit -m "Atualiza dados da liturgia"
            git push
          else
            echo "Nenhuma alteracao para salvar."
          fi

