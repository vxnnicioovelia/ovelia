<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada — Ovelia</title>
<script>
/* GitHub Pages de projeto serve o site em /nome-do-repositorio/. O <base> faz imagens e links funcionarem em qualquer profundidade de endereço. */
(function(){var p=location.pathname.split('/')[1],b='/';if(/\.github\.io$/.test(location.hostname)&&p)b='/'+p+'/';document.write('<base href="'+b+'">')})();
</script>
<link rel="icon" href="img/favicon-64.png" type="image/png">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F8F5FC;color:#292238;font:18px/1.5 system-ui,sans-serif;text-align:center;padding:24px}
@media (prefers-color-scheme:dark){body{background:#17131F;color:#F8F5FC}}
h1{font-family:Georgia,serif;margin:.4em 0}
img{max-width:60vw;height:auto}
a{display:inline-block;margin-top:12px;padding:12px 22px;border-radius:99px;background:#D7C1F2;color:#292238;font-weight:700;text-decoration:none}
a:focus-visible{outline:3px solid #62458F;outline-offset:3px}
</style>
</head>
<body>
<main>
<img src="img/ovelha.png" width="162" height="213" alt="Ovelinha mascote do Ovelia">
<h1>Esta página não existe</h1>
<p>A ovelhinha procurou, mas não achou esse endereço.</p>
<a href="./">Voltar ao início</a>
</main>
</body>
</html>
